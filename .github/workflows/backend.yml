name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "compose.yaml"
      - "deploy/nginx.conf"
      - ".github/workflows/backend.yml"

# Prevent two deployments from modifying the same EC2 instance
# at the same time.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -euo pipefail

            cd ~/substrate-website

            echo "==> Syncing repository"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Starting MySQL"
            docker compose up -d mysql

            echo "==> Waiting for MySQL to become healthy"

            MYSQL_CONTAINER="$(docker compose ps -q mysql)"

            if [ -z "$MYSQL_CONTAINER" ]; then
              echo "::error::MySQL container was not created"
              docker compose ps
              exit 1
            fi

            for _ in $(seq 1 30); do
              STATUS="$(docker inspect \
                --format='{{.State.Health.Status}}' \
                "$MYSQL_CONTAINER" 2>/dev/null || true)"

              if [ "$STATUS" = "healthy" ]; then
                echo "MySQL is healthy"
                break
              fi

              sleep 2
            done

            STATUS="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$MYSQL_CONTAINER" 2>/dev/null || true)"

            if [ "$STATUS" != "healthy" ]; then
              echo "::error::MySQL did not become healthy"
              docker compose logs --tail 100 mysql
              exit 1
            fi

            echo "==> Building backend image"
            docker compose build backend

            echo "==> Running database migration"
            docker compose run --rm backend npm run migrate

            echo "==> Starting backend"
            docker compose up -d --remove-orphans backend

            echo "==> Waiting for backend"

            for _ in $(seq 1 30); do
              if curl -fsS --max-time 3 \
                http://127.0.0.1:4000/api/health >/dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi

              sleep 2
            done

            if ! curl -fsS --max-time 3 \
              http://127.0.0.1:4000/api/health >/dev/null 2>&1; then
              echo "::error::Backend health check failed"
              docker compose logs --tail 100 backend
              exit 1
            fi

            echo "==> Installing Nginx configuration"
            sudo cp deploy/nginx.conf \
              /etc/nginx/sites-available/substrate

            echo "==> Testing Nginx configuration"
            sudo nginx -t

            echo "==> Reloading Nginx"
            sudo systemctl reload nginx

            echo "==> Verifying public API path locally"

            for _ in $(seq 1 15); do
              if curl -fsS --max-time 3 \
                http://127.0.0.1/api/health >/dev/null 2>&1; then
                echo "Nginx -> backend is healthy"
                break
              fi

              sleep 1
            done

            if ! curl -fsS --max-time 3 \
              http://127.0.0.1/api/health; then
              echo
              echo "::error::Nginx API health check failed"
              sudo nginx -t
              docker compose logs --tail 100 backend
              exit 1
            fi

            echo
            echo "==> Cleaning obsolete Docker resources"
            docker image prune -f

            echo "==> Deployment successful"
