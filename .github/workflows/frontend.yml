name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/frontend.yml"

# Two syncs interleaving on one bucket could leave index.html pointing at
# assets the other run has just deleted.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production is same-origin: CloudFront serves the site and routes
      # /api/* to EC2, so the frontend uses relative /api paths and needs no
      # API origin at build time. VITE_API_BASE_URL is still honoured by
      # src/lib/api.js if it is ever set locally, but CI must not set it.
      - name: Build website
        run: npm run build

      # Inverse of the old guard: an absolute API origin in the bundle would
      # mean mixed content on the HTTPS site, so fail rather than ship it.
      - name: Verify the bundle is same-origin
        run: |
          if grep -rqE "https?://([0-9]{1,3}\.){3}[0-9]{1,3}|https?://api\." dist/assets/*.js; then
            echo "::error::The bundle contains an absolute API origin. Production must call /api on its own origin."
            grep -roE "https?://[^\"\`,)]{0,45}" dist/assets/*.js | sort -u | head -20
            exit 1
          fi
          echo "OK: no absolute API origin - requests resolve against the CloudFront domain."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Order matters. Hashed assets go up first so that when the new
      # index.html lands, everything it references already exists.
      - name: Deploy assets to S3
        run: |
          aws s3 sync dist/assets/ s3://${{ secrets.S3_BUCKET }}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      # index.html is not content-hashed, so it must never be cached, or
      # browsers keep loading a stale document pointing at deleted assets.
      - name: Deploy index.html and root files to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      # Optional. The sync above already sets index.html to must-revalidate,
      # and CloudFront honours it (responses show "RefreshHit"), so a deploy
      # reaches users without this. It is kept as a belt-and-braces step and
      # is skipped when the distribution id is not configured.
      - name: Invalidate CloudFront index.html
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/index.html"
