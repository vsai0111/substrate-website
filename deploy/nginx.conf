# Substrate — nginx site config for the EC2 host.
#
# Two jobs:
#   1. Serve the static SPA and fall back to index.html so client-side routes
#      like /book-a-demo survive a hard refresh or a shared link.
#   2. Proxy /api to the Node API on loopback, which keeps the browser
#      same-origin (no CORS in production) and the API off the public internet.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/substrate
#   sudo ln -sf /etc/nginx/sites-available/substrate /etc/nginx/sites-enabled/substrate
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    root /var/www/substrate-website/current;
    index index.html;

    # Compress text assets. Hashed files are already small, but this helps
    # index.html and the CSS bundle noticeably.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Hashed filenames change whenever content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is never hashed — it must always be revalidated, or browsers
    # keep loading a stale document that points at deleted assets.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # The API, proxied to the Node process on loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback. Without this, /book-a-demo returns 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
